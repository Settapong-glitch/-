<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#2563eb"><title>SAMS ระบบจัดการกิจกรรมโรงเรียน</title>
<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1b1f2a;--p:#2563eb;--b:#dde1ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--c:#1c1f28;--t:#e8eaf0;--b:#2e3340}}
:root[data-theme="dark"]{--bg:#12141a;--c:#1c1f28;--t:#e8eaf0;--b:#2e3340}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,"Noto Sans Thai",sans-serif}
header{background:var(--p);color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header b{flex:1}select,input,button{font:inherit;padding:6px 8px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}
button{background:var(--p);color:#fff;border:0;cursor:pointer}button.g{background:#64748b}button.r{background:#dc2626}
nav{display:flex;position:sticky;top:0;background:var(--c);border-bottom:1px solid var(--b)}
nav button{flex:1;background:none;color:var(--t);border-radius:0;padding:10px 4px}nav .on{border-bottom:3px solid var(--p);font-weight:700}
main{padding:12px;max-width:900px;margin:auto}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.w{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--b);padding:5px 8px;text-align:left;font-size:14px}
code{background:var(--bg);padding:1px 4px;border-radius:4px}
</style></head><body>
<header><b>🏫 SAMS</b><span id="who"></span></header>
<nav id="nav"></nav><main id="m"></main>
<script>
const K='sams1';let D,cur='S01',tab=0,ca=1;
try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=D||{types:['เข้าค่าย','กีฬาสี','วันวิชาการ','จิตอาสา','ชุมนุม','ค่ายอบรม'],
st:[{id:'S01',n:'สมชาย ใจดี',c:'ม.4/1'},{id:'S02',n:'สมหญิง รักเรียน',c:'ม.4/2'},{id:'S03',n:'ปิติ มีสุข',c:'ม.5/1'}],
ac:[{id:1,n:'กีฬาสี',t:'กีฬาสี',d:'2026-11-10',tm:'08:30',p:'สนามโรงเรียน',h:6,sc:'ภายใน'},{id:2,n:'จิตอาสาพัฒนาชุมชน',t:'จิตอาสา',d:'2026-11-20',tm:'09:00',p:'วัดท่าข้าม',h:4,sc:'ภายนอก'}],rg:[],nx:3};
const $=s=>document.getElementById(s),A=id=>D.ac.find(a=>a.id==id),S=id=>D.st.find(s=>s.id==id),sv=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
D.us=D.us||[{u:'admin',p:'admin123',r:'admin',n:'ผู้ดูแลระบบ'},{u:'teacher1',p:'1234',r:'teacher',n:'ครูสมศรี'},{u:'S01',p:'1234',r:'student',n:'สมชาย ใจดี',sid:'S01'},{u:'S02',p:'1234',r:'student',n:'สมหญิง รักเรียน',sid:'S02'},{u:'S03',p:'1234',r:'student',n:'ปิติ มีสุข',sid:'S03'}];
let me=D.me||null;const R=()=>me&&me.r,TT=()=>R()!='student';
const RN={student:'นักเรียน',teacher:'ครู',admin:'แอดมิน'};
const TABS={student:[['กิจกรรม',v0],['ประวัติของฉัน',v2]],teacher:[['กิจกรรม',v0],['เช็คชื่อ/ประเมิน',v1],['รายงาน',v2]],admin:[['กิจกรรม',v0],['เช็คชื่อ/ประเมิน',v1],['รายงาน',v2],['จัดการระบบ',v4]]};
function go(){sv();if(!me)return login();cur=me.sid||null;const t=TABS[me.r];if(tab>=t.length)tab=0;
$('who').innerHTML=`${me.n} (${RN[me.r]}) <button class="g" onclick="out()">ออกจากระบบ</button>`;
$('nav').innerHTML=t.map((x,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};go()">${x[0]}</button>`).join('');
$('m').innerHTML=t[tab][1]()}
function login(){$('who').innerHTML='';$('nav').innerHTML='';$('m').innerHTML=`<div class="card" style="max-width:360px;margin:30px auto"><b>🔐 เข้าสู่ระบบ SAMS</b><div class="row"><input id="u" placeholder="ชื่อผู้ใช้" style="flex:1"></div><div class="row"><input id="pw" type="password" placeholder="รหัสผ่าน" style="flex:1" onkeydown="if(event.key=='Enter')inn()"></div><div class="row"><button onclick="inn()">เข้าสู่ระบบ</button></div><p id="er" style="color:#dc2626"></p></div>`}
function inn(){const x=D.us.find(a=>a.u==$('u').value.trim()&&a.p==$('pw').value);if(!x){$('er').textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';return}me=D.me=x;tab=0;go()}
function out(){me=D.me=null;go()}
function v0(){const mine=D.rg.filter(r=>r.s==cur);
return (TT()?`<div class="card"><b>เพิ่มกิจกรรม</b><div class="row"><input id="n" placeholder="ชื่อกิจกรรม"><select id="t">${D.types.map(t=>`<option>${t}</option>`).join('')}</select><select id="sc"><option>ภายใน</option><option>ภายนอก</option></select><input id="d" type="date"><input id="tm" type="time"><input id="p" placeholder="สถานที่"><input id="h" type="number" placeholder="ชั่วโมง" style="width:90px"><button onclick="addA()">เพิ่ม</button></div></div>`:'')+
D.ac.map(a=>{const r=mine.find(r=>r.a==a.id);return `<div class="card"><b>${a.n}</b> <small>(${a.t} · ${a.sc})</small><br>📅 ${a.d} ${a.tm} · 📍 ${a.p} · ⏱ ${a.h} ชม.<div class="row">${R()=='student'?(r?`<span>สถานะของฉัน: <b>${r.x}</b></span>`:`<button onclick="reg(${a.id})">ลงทะเบียน</button>`):''}${TT()?`<button class="r" onclick="delA(${a.id})">ลบ</button>`:''}</div></div>`}).join('')}
function addA(){const n=$('n').value.trim();if(!n)return;D.ac.push({id:D.nx++,n,t:$('t').value,sc:$('sc').value,d:$('d').value,tm:$('tm').value,p:$('p').value,h:+$('h').value||0});go()}
function delA(id){D.ac=D.ac.filter(a=>a.id!=id);D.rg=D.rg.filter(r=>r.a!=id);go()}
function reg(a){D.rg.push({a,s:cur,x:'ลงทะเบียน',sc:0,h:0});go()}
function v1(){if(!A(ca)&&D.ac[0])ca=D.ac[0].id;
const rows=D.rg.map((r,i)=>[r,i]).filter(([r])=>r.a==ca);
return `<div class="card"><select onchange="ca=this.value;go()">${D.ac.map(a=>`<option value="${a.id}" ${a.id==ca?'selected':''}>${a.n}</option>`).join('')}</select></div><div class="card w"><table><tr><th>นักเรียน</th><th>สถานะ</th><th>คะแนน</th><th>ชม.</th><th></th></tr>`+
(rows.map(([r,i])=>`<tr><td>${S(r.s).n}</td><td>${r.x}</td><td><input type="number" value="${r.sc}" style="width:70px" onchange="D.rg[${i}].sc=+this.value;sv()"></td><td>${r.h}</td><td><button onclick="mk(${i},'เข้าร่วม')">มา</button> <button class="g" onclick="mk(${i},'ขาด')">ขาด</button></td></tr>`).join('')||'<tr><td colspan=5>ยังไม่มีผู้ลงทะเบียน</td></tr>')+`</table></div>`}
function mk(i,x){const r=D.rg[i];r.x=x;r.h=x=='เข้าร่วม'?A(r.a).h:0;go()}
function v2(){if(R()=='student')return v5();return `<div class="card w"><b>คะแนน/ชั่วโมงสะสมนักเรียน</b><table><tr><th>นักเรียน</th><th>ห้อง</th><th>เข้าร่วม</th><th>ชม.รวม</th><th>คะแนนรวม</th></tr>`+
D.st.map(s=>{const o=D.rg.filter(r=>r.s==s.id&&r.x=='เข้าร่วม');return `<tr><td>${s.n}</td><td>${s.c}</td><td>${o.length}</td><td>${o.reduce((a,r)=>a+r.h,0)}</td><td>${o.reduce((a,r)=>a+r.sc,0)}</td></tr>`}).join('')+
`</table></div><div class="card w"><b>สถิติกิจกรรม</b><table><tr><th>กิจกรรม</th><th>ลงทะเบียน</th><th>เข้าร่วม</th><th>%</th></tr>`+
D.ac.map(a=>{const g=D.rg.filter(r=>r.a==a.id),p=g.filter(r=>r.x=='เข้าร่วม').length;return `<tr><td>${a.n}</td><td>${g.length}</td><td>${p}</td><td>${g.length?Math.round(p*100/g.length):0}%</td></tr>`}).join('')+`</table></div>`}
function v5(){const o=D.rg.filter(r=>r.s==cur),k=o.filter(r=>r.x=='เข้าร่วม');return `<div class="card"><b>ชั่วโมงสะสม ${k.reduce((a,r)=>a+r.h,0)} ชม. · คะแนนรวม ${k.reduce((a,r)=>a+r.sc,0)}</b></div><div class="card w"><table><tr><th>กิจกรรม</th><th>วันที่</th><th>สถานะ</th><th>คะแนน</th><th>ชม.</th></tr>${o.map(r=>`<tr><td>${A(r.a)?A(r.a).n:'-'}</td><td>${A(r.a)?A(r.a).d:''}</td><td>${r.x}</td><td>${r.sc}</td><td>${r.h}</td></tr>`).join('')||'<tr><td colspan=5>ยังไม่มีประวัติ</td></tr>'}</table></div>`}
function v4(){return `<div class="card"><b>เพิ่มผู้ใช้</b><div class="row"><input id="nu" placeholder="username"><input id="np" placeholder="password"><input id="nn" placeholder="ชื่อ-สกุล"><select id="nr"><option value="student">นักเรียน</option><option value="teacher">ครู</option><option value="admin">แอดมิน</option></select><input id="nc" placeholder="ห้อง (นักเรียน)" style="width:110px"><button onclick="addU()">เพิ่ม</button></div></div><div class="card"><b>เพิ่มประเภทกิจกรรม</b><div class="row"><input id="nt" placeholder="ชื่อประเภท"><button onclick="if($('nt').value.trim()){D.types.push($('nt').value.trim());go()}">เพิ่ม</button></div><small>ประเภทปัจจุบัน: ${D.types.join(', ')}</small></div><div class="card w"><table><tr><th>ผู้ใช้</th><th>ชื่อ</th><th>บทบาท</th><th></th></tr>${D.us.map((x,i)=>`<tr><td>${x.u}</td><td>${x.n}</td><td>${RN[x.r]}</td><td>${x.u==me.u?'':`<button class="r" onclick="D.us.splice(${i},1);go()">ลบ</button>`}</td></tr>`).join('')}</table></div>`}
function addU(){const u=$('nu').value.trim(),p=$('np').value,n=$('nn').value.trim(),r=$('nr').value;if(!u||!p||!n||D.us.some(x=>x.u==u))return alert('ข้อมูลไม่ครบหรือชื่อผู้ใช้ซ้ำ');const x={u,p,r,n};if(r=='student'){x.sid=u;D.st.push({id:u,n,c:$('nc').value})}D.us.push(x);go()}
go();
</script></body></html>
